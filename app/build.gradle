plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nijatva.dialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.nijatva.dialer"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
